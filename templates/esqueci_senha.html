<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia — Recuperar Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --bg-card: #141414;
            --stroke: #2b2b2b;
            --text: #f5f5f3;
            --text-dim: #9a9a97;
            --brass: #d81f2c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0b0b0b;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--stroke);
            padding: 40px 24px;
            border-radius: 12px;
        }
        h1 {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #fefefe;
        }
        p { color: var(--text-dim); margin-bottom: 24px; font-size: 0.9rem; line-height: 1.5; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-dim);
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--stroke);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Work Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: var(--brass); }
        .btn {
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            cursor: pointer;
            border: none;
            width: 100%;
            background: var(--brass);
            color: #fff;
            margin-top: 10px;
            transition: filter 0.15s ease;
            display: block;
            text-align: center;
        }
        .btn:hover { filter: brightness(1.1); }
        .voltar {
            display: block;
            margin-top: 20px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
        }
        .voltar:hover { color: var(--text); }
        .erro { background: #3a0f14; color: #ff8c98; padding: 10px 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Recuperar Senha</h1>
        <p>Informe o e-mail da sua conta. Enviaremos um código de verificação para redefinir a sua senha.</p>
        
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" maxlength="100" required placeholder="seu@email.com" autofocus>
            </div>
            <button type="submit" class="btn">Enviar Código</button>
        </form>

        <a href="{{ url_for('login') }}" class="voltar">Voltar para o login</a>
    </div>
</body>
</html>
