<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Cartões - Barbearia Versati</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 28px 16px;
    }

    .container-cartoes {
      max-width: 680px;
      margin: 0 auto;
    }

    .topo-pagina {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #222;
    }

    .topo-pagina h1 {
      margin: 0;
      font-size: 22px;
      color: #ffffff;
    }

    .topo-pagina p {
      margin: 4px 0 0;
      font-size: 14px;
      color: #a0a0a0;
    }

    .acoes-topo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      background: #161616;
      color: #e0e0e0;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-voltar:hover {
      border-color: #555;
      color: #ffffff;
    }

    .btn-meus-cartoes {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #e5243b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-meus-cartoes:hover {
      background: #c81b30;
    }

    .btn-meus-cartoes:active {
      transform: scale(0.99);
    }

    .painel-cartoes {
      background: #141414;
      border: 1px solid #262626;
      border-radius: 14px;
      padding: 20px;
    }

    .painel-cartoes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .painel-cartoes-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .btn-secundario {
      background: #1e1e1e;
      color: #ffffff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secundario:hover {
      border-color: #e5243b;
    }

    .modal-cartoes-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-cartoes-backdrop.aberto {
      display: flex;
    }

    .modal-cartoes-box {
      width: 100%;
      max-width: 450px;
      background: #141414;
      color: #ffffff;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    .modal-cartoes-topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-cartoes-topo h3 {
      margin: 0;
      font-size: 18px;
    }

    .btn-fechar-cartoes {
      background: transparent;
      border: none;
      color: #aaaaaa;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    .btn-fechar-cartoes:hover {
      color: #ffffff;
    }

    .cartao-salvo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .cartao-salvo-item:last-child {
      margin-bottom: 0;
    }

    .cartao-salvo-bandeira {
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      color: #e5243b;
    }

    .cartao-salvo-numero {
      font-size: 15px;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .cartao-salvo-validade {
      font-size: 12px;
      color: #9e9e9e;
      margin-top: 2px;
    }

    .btn-remover-cartao {
      background: transparent;
      color: #ff6b7a;
      border: 1px solid rgba(255, 107, 122, 0.35);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-remover-cartao:hover:not(:disabled) {
      background: rgba(229, 36, 59, 0.16);
      border-color: #e5243b;
    }

    .btn-remover-cartao:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .cartoes-feedback {
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: none;
    }

    .cartoes-feedback.erro {
      display: block;
      background: rgba(229, 36, 59, 0.15);
      border: 1px solid rgba(229, 36, 59, 0.4);
      color: #ff8a96;
    }

    .cartoes-feedback.ok {
      display: block;
      background: rgba(46, 204, 113, 0.14);
      border: 1px solid rgba(46, 204, 113, 0.4);
      color: #7ef2ad;
    }

    .cartoes-vazio {
      text-align: center;
      padding: 22px 10px;
      color: #b0b0b0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container-cartoes">
    <div class="topo-pagina">
      <div>
        <h1>Meus Cartões</h1>
        <p>Gerencie os cartões salvos na sua conta da Barbearia Versati.</p>
      </div>
      <div class="acoes-topo">
        <a href="/" class="btn-voltar">Voltar ao início</a>
        <button type="button" class="btn-meus-cartoes" onclick="abrirModalCartoes()">
          Abrir em Modal
        </button>
      </div>
    </div>

    <section class="painel-cartoes">
      <div class="painel-cartoes-header">
        <h2>Cartões cadastrados</h2>
        <button type="button" class="btn-secundario" onclick="carregarCartoesEmTodos()">
          Atualizar
        </button>
      </div>
      <div id="feedbackPaginaCartoes" class="cartoes-feedback"></div>
      <div id="listaPaginaCartoes">
        <div class="cartoes-vazio">Carregando cartões...</div>
      </div>
    </section>
  </div>

  <div id="modalMeusCartoes" class="modal-cartoes-backdrop" onclick="fecharModalCartoesBackdrop(event)">
    <div class="modal-cartoes-box" role="dialog" aria-modal="true" aria-labelledby="tituloMeusCartoes">
      <div class="modal-cartoes-topo">
        <h3 id="tituloMeusCartoes">Meus Cartões</h3>
        <button type="button" class="btn-fechar-cartoes" onclick="fecharModalCartoes()" aria-label="Fechar">&times;</button>
      </div>
      <div id="feedbackModalCartoes" class="cartoes-feedback"></div>
      <div id="listaModalCartoes">
        <div class="cartoes-vazio">Carregando cartões...</div>
      </div>
    </div>
  </div>

  <script>
    function _escaparHtml(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function _setFeedback(elementId, mensagem, tipo) {
      const el = document.getElementById(elementId);
      if (!el) return;
      if (!mensagem) {
        el.className = "cartoes-feedback";
        el.textContent = "";
        return;
      }
      el.className = `cartoes-feedback ${tipo}`;
      el.textContent = mensagem;
    }

    function _renderizarLista(containerId, cartoes) {
      const lista = document.getElementById(containerId);
      if (!lista) return;

      if (!cartoes.length) {
        lista.innerHTML = '<div class="cartoes-vazio">Você ainda não possui cartões salvos.</div>';
        return;
      }

      lista.innerHTML = cartoes.map((c) => {
        const mes = c.mes_expiracao ? String(c.mes_expiracao).padStart(2, "0") : "--";
        const ano = c.ano_expiracao ? String(c.ano_expiracao).slice(-2) : "--";
        const bandeira = _escaparHtml(c.bandeira || "Cartão");
        const ultimos4 = _escaparHtml(c.ultimos_4 || "----");
        const idCartao = Number(c.id);

        return `
          <div class="cartao-salvo-item">
            <div>
              <div class="cartao-salvo-bandeira">${bandeira}</div>
              <div class="cartao-salvo-numero">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; ${ultimos4}</div>
              <div class="cartao-salvo-validade">Validade: ${mes}/${ano}</div>
            </div>
            <button type="button" class="btn-remover-cartao" onclick="removerMeuCartao(${idCartao}, this)">
              Remover
            </button>
          </div>
        `;
      }).join("");
    }

    function carregarCartoesEmTodos() {
      const destinos = ["listaPaginaCartoes", "listaModalCartoes"];
      destinos.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = '<div class="cartoes-vazio">Carregando cartões...</div>';
      });

      fetch("/api/meus-cartoes", {
        method: "GET",
        credentials: "same-origin",
        headers: { "X-Requested-With": "fetch" }
      })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.sucesso) {
            throw new Error(data.mensagem || "Não foi possível carregar seus cartões.");
          }
          return data.cartoes || [];
        })
        .then((cartoes) => {
          destinos.forEach((id) => _renderizarLista(id, cartoes));
        })
        .catch((err) => {
          const msg = `<div class="cartoes-vazio">${_escaparHtml(err.message)}</div>`;
          destinos.forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.innerHTML = msg;
          });
        });
    }

    function removerMeuCartao(cartaoId, botao) {
      if (!confirm("Deseja remover este cartão salvo?")) return;

      if (botao) botao.disabled = true;
      _setFeedback("feedbackPaginaCartoes", "", "");
      _setFeedback("feedbackModalCartoes", "", "");

      fetch(`/api/meus-cartoes/${cartaoId}`, {
        method: "DELETE",
        credentials: "same-origin",
        headers: { "X-Requested-With": "fetch" }
      })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.sucesso) {
            throw new Error(data.mensagem || "Não foi possível remover o cartão.");
          }
          return data;
        })
        .then((data) => {
          const msg = data.mensagem || "Cartão removido com sucesso!";
          _setFeedback("feedbackPaginaCartoes", msg, "ok");
          _setFeedback("feedbackModalCartoes", msg, "ok");
          carregarCartoesEmTodos();
        })
        .catch((err) => {
          if (botao) botao.disabled = false;
          _setFeedback("feedbackPaginaCartoes", err.message, "erro");
          _setFeedback("feedbackModalCartoes", err.message, "erro");
        });
    }

    function abrirModalCartoes() {
      _setFeedback("feedbackModalCartoes", "", "");
      document.getElementById("modalMeusCartoes").classList.add("aberto");
      carregarCartoesEmTodos();
    }

    function fecharModalCartoes() {
      document.getElementById("modalMeusCartoes").classList.remove("aberto");
    }

    function fecharModalCartoesBackdrop(event) {
      if (event.target.id === "modalMeusCartoes") {
        fecharModalCartoes();
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        fecharModalCartoes();
      }
    });

    document.addEventListener("DOMContentLoaded", carregarCartoesEmTodos);
  </script>
</body>
</html>
