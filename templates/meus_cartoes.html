<style>
  .btn-meus-cartoes {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-meus-cartoes:hover {
    background: #262626;
    border-color: #e5243b;
  }

  .modal-cartoes-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-cartoes-backdrop.aberto {
    display: flex;
  }
  .modal-cartoes-box {
    width: 100%;
    max-width: 450px;
    background: #141414;
    color: #fff;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
  }
  .modal-cartoes-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-cartoes-topo h3 {
    margin: 0;
    font-size: 18px;
  }
  .btn-fechar-cartoes {
    background: transparent;
    border: none;
    color: #aaa;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .btn-fechar-cartoes:hover {
    color: #fff;
  }

  .cartao-salvo-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #1e1e1e;
    border: 1px solid #2e2e2e;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .cartao-salvo-bandeira {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    color: #e5243b;
  }
  .cartao-salvo-numero {
    font-size: 15px;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .cartao-salvo-validade {
    font-size: 12px;
    color: #9e9e9e;
    margin-top: 2px;
  }

  .btn-remover-cartao {
    background: transparent;
    color: #ff6b7a;
    border: 1px solid rgba(255, 107, 122, 0.35);
    border-radius: 7px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-remover-cartao:hover:not(:disabled) {
    background: rgba(229, 36, 59, 0.16);
    border-color: #e5243b;
  }
  .btn-remover-cartao:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .cartoes-feedback {
    font-size: 13px;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 12px;
    display: none;
  }
  .cartoes-feedback.erro {
    display: block;
    background: rgba(229, 36, 59, 0.15);
    border: 1px solid rgba(229, 36, 59, 0.4);
    color: #ff8a96;
  }
  .cartoes-feedback.ok {
    display: block;
    background: rgba(46, 204, 113, 0.14);
    border: 1px solid rgba(46, 204, 113, 0.4);
    color: #7ef2ad;
  }
  .cartoes-vazio {
    text-align: center;
    padding: 22px 10px;
    color: #b0b0b0;
    font-size: 14px;
  }
</style>

<button type="button" class="btn-meus-cartoes" onclick="abrirModalCartoes()">
  Meus Cartões
</button>

<div id="modalMeusCartoes" class="modal-cartoes-backdrop" onclick="fecharModalCartoesBackdrop(event)">
  <div class="modal-cartoes-box" role="dialog" aria-modal="true" aria-labelledby="tituloMeusCartoes">
    <div class="modal-cartoes-topo">
      <h3 id="tituloMeusCartoes">Meus Cartões</h3>
      <button type="button" class="btn-fechar-cartoes" onclick="fecharModalCartoes()" aria-label="Fechar">&times;</button>
    </div>
    <div id="feedbackMeusCartoes" class="cartoes-feedback"></div>
    <div id="listaMeusCartoes">
      <div class="cartoes-vazio">Carregando cartões...</div>
    </div>
  </div>
</div>

<script>
  function _escaparHtml(texto) {
    return String(texto ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function _mostrarFeedbackCartoes(mensagem, tipo) {
    const el = document.getElementById("feedbackMeusCartoes");
    if (!mensagem) {
      el.className = "cartoes-feedback";
      el.textContent = "";
      return;
    }
    el.className = `cartoes-feedback ${tipo}`;
    el.textContent = mensagem;
  }

  function carregarMeusCartoes() {
    const lista = document.getElementById("listaMeusCartoes");
    lista.innerHTML = '<div class="cartoes-vazio">Carregando cartões...</div>';

    fetch("/api/meus-cartoes", {
      method: "GET",
      credentials: "same-origin",
      headers: { "X-Requested-With": "fetch" }
    })
      .then(async (res) => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.sucesso) {
          throw new Error(data.mensagem || "Não foi possível carregar seus cartões.");
        }
        return data.cartoes || [];
      })
      .then((cartoes) => {
        if (!cartoes.length) {
          lista.innerHTML = '<div class="cartoes-vazio">Você ainda não possui cartões salvos.</div>';
          return;
        }

        lista.innerHTML = cartoes.map((c) => {
          const mes = c.mes_expiracao ? String(c.mes_expiracao).padStart(2, "0") : "--";
          const ano = c.ano_expiracao ? String(c.ano_expiracao).slice(-2) : "--";
          const bandeira = _escaparHtml(c.bandeira || "Cartão");
          const ultimos4 = _escaparHtml(c.ultimos_4 || "----");
          const idCartao = Number(c.id);

          return `
            <div class="cartao-salvo-item" id="cartao-item-${idCartao}">
              <div>
                <div class="cartao-salvo-bandeira">${bandeira}</div>
                <div class="cartao-salvo-numero">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; ${ultimos4}</div>
                <div class="cartao-salvo-validade">Validade: ${mes}/${ano}</div>
              </div>
              <button type="button" class="btn-remover-cartao" onclick="removerMeuCartao(${idCartao}, this)">
                Remover
              </button>
            </div>
          `;
        }).join("");
      })
      .catch((err) => {
        lista.innerHTML = `<div class="cartoes-vazio">${_escaparHtml(err.message)}</div>`;
      });
  }

  function removerMeuCartao(cartaoId, botao) {
    if (!confirm("Deseja remover este cartão salvo?")) return;

    if (botao) botao.disabled = true;
    _mostrarFeedbackCartoes("", "");

    fetch(`/api/meus-cartoes/${cartaoId}`, {
      method: "DELETE",
      credentials: "same-origin",
      headers: { "X-Requested-With": "fetch" }
    })
      .then(async (res) => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.sucesso) {
          throw new Error(data.mensagem || "Não foi possível remover o cartão.");
        }
        return data;
      })
      .then((data) => {
        _mostrarFeedbackCartoes(data.mensagem || "Cartão removido.", "ok");
        carregarMeusCartoes();
      })
      .catch((err) => {
        if (botao) botao.disabled = false;
        _mostrarFeedbackCartoes(err.message, "erro");
      });
  }

  function abrirModalCartoes() {
    _mostrarFeedbackCartoes("", "");
    document.getElementById("modalMeusCartoes").classList.add("aberto");
    carregarMeusCartoes();
  }

  function fecharModalCartoes() {
    document.getElementById("modalMeusCartoes").classList.remove("aberto");
  }

  function fecharModalCartoesBackdrop(event) {
    if (event.target.id === "modalMeusCartoes") {
      fecharModalCartoes();
    }
  }

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      fecharModalCartoes();
    }
  });
</script>
